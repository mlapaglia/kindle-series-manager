name: Package Release

on:
  release:
    types: [created]

permissions:
  contents: write

env:
  FBINK_VERSION: v1.27.0
  FBINK_REPO: mlapaglia/FBInk
  FBINK_HASH: b6334723
  TAG_NAME: ${{ github.event.release.tag_name }}

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Build ss_shield
        run: bash tools/ss_shield/build.sh

      - name: Download FBInk binaries
        run: |
          BIN_DIR=kual-extension/kindle-series-manager/bin
          BASE_URL="https://github.com/${{ env.FBINK_REPO }}/releases/download/${{ env.FBINK_VERSION }}"

          TMPDIR=$(mktemp -d)
          for PAIR in "Kindle-HF:fbink_hf" "Kindle:fbink_sf" "Kindle5:fbink_k5"; do
            VARIANT="${PAIR%%:*}"
            TARGET="${PAIR##*:}"
            curl -fSL "$BASE_URL/FBInk-${VARIANT}-${{ env.FBINK_HASH }}.tar.gz" | tar -xzf - -C "$TMPDIR"
            mv "$TMPDIR/fbink" "$BIN_DIR/$TARGET"
            rm -f "$TMPDIR"/*
          done
          rm -rf "$TMPDIR"
          chmod +x "$BIN_DIR"/fbink_*
          ls -la "$BIN_DIR"/fbink_*

      - name: Embed version
        run: echo "$TAG_NAME" > kual-extension/kindle-series-manager/VERSION

      - name: Create zip archive
        run: |
          zip -r "kindle-series-manager-${TAG_NAME}.zip" . \
            -x '.git/*' '.github/*' '.venv/*' '.pytest_cache/*' \
            'tests/*' 'tools/*' 'Dockerfile.test' 'run_tests.sh' \
            'pyproject.toml' '__pycache__/*' '*.pyc'

      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG_NAME" "kindle-series-manager-${TAG_NAME}.zip"
